url: https://biostat.umed.pl/OmicSelector/

home:
  title: OmicSelector 2.0 - Rigorous Biomarker Discovery
  links:
  - text: Konrad Stawiski, M.D., Ph.D.
    href: https://konsta.com.pl
  - text: Department of Biostatistics and Translational Research
    href: https://biostat.umed.pl

template:
  bootstrap: 5
  bslib:
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto Slab"}
    code_font: {google: "JetBrains Mono"}

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [github]
  components:
    intro:
      icon: fa-home
      text: Home
      href: index.html
    reference:
      icon: fa-file-code
      text: Reference
      href: reference/index.html
    articles:
      icon: fas fa-book
      text: Articles
      menu:
      - text: Getting Started
        href: articles/getting-started.html
      - text: TCGA Biomarker Discovery
        href: articles/tcga-tutorial.html
      - text: "---"
      - text: "Phase 5: Advanced Features"
        href: articles/phase5-advanced.html
    github:
      icon: fa-github
      href: https://github.com/kstawiski/OmicSelector

reference:
- title: Core Pipeline
  desc: Main classes for building zero-leakage ML pipelines
  contents:
  - OmicPipeline
  - BenchmarkService
  - omic_benchmark

- title: Signature Selection
  desc: Multi-objective biomarker signature selection
  contents:
  - select_best_signature
  - get_consensus_features

- title: Stability Analysis
  desc: Feature selection stability metrics
  contents:
  - compute_nogueira_index
  - compute_stability_metrics

- title: Batch Correction
  desc: FrozenComBat for proper batch effect handling
  contents:
  - FrozenComBat
  - fit_combat
  - apply_combat

- title: Calibration
  desc: Probability calibration and diagnostics
  contents:
  - CalibrationService
  - compute_calibration_metrics
  - calibrate_model

- title: Interpretability
  desc: Model interpretation and feature importance
  contents:
  - InterpretabilityService
  - compute_shap_values

- title: "Phase 5: GOF Filters"
  desc: Goodness-of-fit filters for sparse/zero-inflated omics data
  contents:
  - FilterGOF_KS
  - FilterHurdle
  - FilterZeroProp
  - make_gof_filter
  - compare_gof_filters
  - register_gof_filters

- title: "Phase 5: Bayesian Tuning"
  desc: Bayesian hyperparameter optimization with mlr3mbo
  contents:
  - make_autotuner_glmnet
  - make_autotuner_xgboost
  - make_autotuner_ranger
  - make_autotuner_lightgbm
  - get_optimal_params
  - get_omics_search_space

- title: "Phase 5: AutoXAI"
  desc: DALEX-based interpretability with correlation warnings
  contents:
  - xai_pipeline
  - plot_xai_importance
  - compute_correlation_warnings
  - create_explainer

- title: "Phase 5: Stability Ensemble"
  desc: Bootstrap-based feature selection stability
  contents:
  - create_stability_ensemble
  - StabilityEnsemble
  - SequentialSelector

- title: "Phase 5: Synthetic Data"
  desc: Data augmentation and synthetic data generation
  contents:
  - smote_augment
  - noise_augment
  - tabddpm_generate
  - validate_synthetic
  - balance_classes

- title: "Phase 5: Deep Learning"
  desc: Deep learning models for omics (requires torch)
  contents:
  - make_mlp_learner
  - make_tabtransformer_learner
  - make_gnn_learner
  - build_correlation_adjacency
  - run_dl_benchmark

- title: Multi-Omics
  desc: Multi-omics late integration
  contents:
  - MultiOmicsStacker

- title: Model Export
  desc: Model deployment utilities
  contents:
  - OmicModelExporter

- title: Legacy Functions
  desc: Functions from OmicSelector 1.x (use with caution)
  contents:
  - starts_with("OmicSelector_")
