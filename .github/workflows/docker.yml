name: Docker
on:
  push:
    tags: [v*]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Release version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^Version: //p' DESCRIPTION)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: github.event_name == 'push' && env.REGISTRY_USER != '' && env.REGISTRY_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: kstawiski/omicselector:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test package and roster
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker run --rm -e RELEASE_VERSION "kstawiski/omicselector:$RELEASE_VERSION" Rscript --vanilla -e 'library(OmicSelector); stopifnot(as.character(packageVersion("OmicSelector")) == Sys.getenv("RELEASE_VERSION"), nrow(singlesample_method_roster()) == 73L)'
      - name: Push tested release image
        if: github.event_name == 'push' && env.REGISTRY_USER != '' && env.REGISTRY_PASSWORD != ''
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: docker push "kstawiski/omicselector:$RELEASE_VERSION"
      - name: Record build-only result
        if: github.event_name != 'push' || env.REGISTRY_USER == '' || env.REGISTRY_PASSWORD == ''
        run: echo 'Image built and smoke-tested; registry push skipped.' >> "$GITHUB_STEP_SUMMARY"
