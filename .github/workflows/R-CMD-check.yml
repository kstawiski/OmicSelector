# OmicSelector 2.0 - R CMD Check
name: R-CMD-check

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # Disable renv auto-activation to use system packages
      RENV_CONFIG_AUTOLOADER_ENABLED: 'false'
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: 'true'
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libtiff-dev \
            libpng-dev \
            libgit2-dev

      - name: Install R dependencies
        run: |
          # Use the RSPM binary repo (set by setup-r with use-public-rspm) so
          # rmarkdown/knitr and every dependency install as fast, reliable binaries
          # rather than source builds.
          rspm <- Sys.getenv("RSPM", unset = "https://packagemanager.posit.co/cran/__linux__/noble/latest")
          options(repos = c(RSPM = rspm, CRAN = "https://cloud.r-project.org"))
          install.packages(c("remotes", "rcmdcheck", "knitr", "rmarkdown"))
          # Install every declared dependency (hard + Suggests) that is actually
          # available on the repo, skipping only the three non-CRAN Suggests
          # (catboost, selbal, StableMate) that cannot be resolved in CI. This keeps
          # test and example coverage for all resolvable Suggests (glmnet, pROC,
          # torch, ...); requesting the full closure with install_deps(dependencies
          # = TRUE) instead aborts because the three are unavailable, and
          # _R_CHECK_FORCE_SUGGESTS_=false lets the check tolerate their absence.
          deps <- remotes::local_package_deps(dependencies = TRUE)
          avail <- rownames(available.packages())
          need <- setdiff(intersect(deps, avail), rownames(installed.packages()))
          if (length(need)) install.packages(need)
        shell: Rscript {0}

      - name: R CMD check
        env:
          _R_CHECK_CRAN_INCOMING_: false
          _R_CHECK_FORCE_SUGGESTS_: false
        run: |
          rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "warning", check_dir = "check")
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: check
